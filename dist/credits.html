<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>开源致谢 · 踏频</title><style>body{font-family:system-ui,sans-serif;max-width:750px;margin:70px auto;padding:24px;line-height:1.9;background:#f4f4ed;color:#242920}a{color:#60772b}h1{font-size:30px}</style></head><body><a href="./">← 返回音乐工坊</a><h1>开源致谢</h1><p>踏频使用以下开源组件，所有处理均在你的浏览器中进行。</p><ul><li><a href="https://github.com/cutterbl/SoundTouchJS">SoundTouchJS 0.3.0</a>：保持音高的时间伸缩。<a href="./vendor/SoundTouch-LICENSE.txt">LGPL 2.1 许可证</a> · <a href="./vendor/soundtouch.js">使用的源代码</a>，未修改核心代码。</li><li><a href="https://github.com/zhuker/lamejs">lamejs 1.2.1</a>：MP3 编码。<a href="./vendor/Lamejs-LICENSE.txt">许可证</a> · <a href="./vendor/lame.js">使用的代码</a>，添加 ES 模块导出。</li></ul><p>节拍分析、波形展示、点声合成、WAV 封装与示例音乐为本项目实现。示例为原创合成音频，不包含用户上传的歌曲。</p><p>支持的格式由浏览器解码能力决定。自动节拍分析为估计，现场演奏或速度变化较大的音乐可能无法与固定点声全程对齐。</p></body></html>
